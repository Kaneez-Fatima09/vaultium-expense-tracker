{% extends 'expenses/base.html' %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <span class="d-inline-flex bg-dark p-3 rounded-circle border border-info mb-2">
                    <i class="fa-solid fa-shield-halved fs-2 neon-text-cyan"></i>
                </span>
                <h3 class="fw-bold text-white mt-2">Welcome Back</h3>
                <p class="text-sub small">Sign in to access your Vaultium workspace</p>
            </div>
            {% if messages %}
                <div style="background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 10px; margin-bottom: 15px; border-radius: 5px;">
                    {% for message in messages %}
                       <p style="margin: 0; font-weight: bold;">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
            <form method="POST" class="custom-input">
                {% csrf_token %}
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-4">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-neon w-100 py-2 fs-6"><i class="fa-solid fa-right-to-bracket me-1"></i> Sign In</button>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary">
                <p class="text-sub small mb-0">Don't have an account? <a href="{% url 'register' %}" class="neon-text-cyan text-decoration-none fw-semibold">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
