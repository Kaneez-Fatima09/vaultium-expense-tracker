{% extends 'expenses/base.html' %}

{% block title %}Confirm Delete - Vaultium{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="glass-card p-4 p-md-5 text-center shadow-lg" style="max-width: 500px; width: 100%;">
        
        <!-- Warning Icon -->
        <div class="mb-3">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle p-3" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3);">
                <i class="bi bi-exclamation-triangle-fill fs-2" style="color: #ef4444;"></i>
            </div>
        </div>

        <h3 class="fw-bold mb-2" style="color: #f8fafc !important;">Are you sure?</h3>
        
        <p class="mb-4" style="color: #cbd5e1 !important; font-size: 1.05rem;">
            Do you really want to delete <strong class="text-white">"{{ expense.title }}"</strong> worth 
            <span class="fw-bold" style="color: #00f2fe !important;">₹{{ expense.amount }}</span>?
        </p>

        <!-- Delete Action Form -->
        <form method="POST" class="d-flex justify-content-center gap-3">
            {% csrf_token %}
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-4 py-2 rounded-2 fw-semibold" style="color: #cbd5e1; border-color: rgba(255,255,255,0.2);">
                Cancel
            </a>
            <button type="submit" class="btn btn-danger px-4 py-2 rounded-2 fw-semibold" style="background-color: #ef4444; border: none; box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);">
                Yes, Delete
            </button>
        </form>
    </div>
</div>
{% endblock %}
