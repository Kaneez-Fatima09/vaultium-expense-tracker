{% extends 'expenses/base.html' %}

{% block content %}
<style>
    /* Django default helptext & lists hide */
    .register-card .helptext, 
    .register-card ul {
        display: none !important;
    }

    /* Input Field Styling & Autofill Fix */
    .custom-dark-input {
        background-color: rgba(15, 23, 42, 0.6) !important;
        border: 1px solid rgba(0, 242, 254, 0.2) !important;
        color: #f8fafc !important;
        border-radius: 10px !important;
        padding: 12px 16px !important;
        transition: all 0.3s ease;
    }

    .custom-dark-input:focus {
        background-color: rgba(15, 23, 42, 0.9) !important;
        border-color: #00f2fe !important;
        box-shadow: 0 0 15px rgba(0, 242, 254, 0.3) !important;
        color: #fff !important;
    }

    /* Autofill White Background Fix */
    .custom-dark-input:-webkit-autofill,
    .custom-dark-input:-webkit-autofill:hover, 
    .custom-dark-input:-webkit-autofill:focus, 
    .custom-dark-input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px #0b1329 inset !important;
        -webkit-text-fill-color: #f8fafc !important;
        transition: background-color 5000s ease-in-out 0s;
    }

    /* Neon Button Styling */
    .btn-neon {
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%) !important;
        color: #000 !important;
        font-weight: 700;
        border: none;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        transition: all 0.3s ease;
    }

    .btn-neon:hover {
        box-shadow: 0 0 30px rgba(0, 242, 254, 0.7);
        transform: translateY(-2px);
        color: #000 !important;
    }

    /* Neon Text & Link Hover Effect */
    .neon-text-cyan {
        color: #00f2fe !important;
        text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        transition: all 0.3s ease;
    }

    .hover-glow:hover {
        text-shadow: 0 0 18px rgba(0, 242, 254, 0.9);
        color: #00f5a0 !important;
    }

    .text-sub {
        color: #94a3b8 !important;
    }
</style>

<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 p-md-5 register-card">
            
            <!-- Header -->
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-plus neon-text-cyan fs-1 mb-2"></i>
                <h2 class="fw-bold text-white mb-1">Create Account</h2>
                <p class="text-sub small">Start tracking your expenses with Vaultium</p>
            </div>

            <!-- Form -->
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label text-sub fw-semibold small">{{ field.label }}</label>
                        <input type="{{ field.field.widget.input_type }}" 
                               name="{{ field.name }}" 
                               class="form-control custom-dark-input" 
                               placeholder="Enter {{ field.label|lower }}"
                               autocomplete="off"
                               required>
                        {% if field.errors %}
                            <div class="text-danger small mt-1"><i class="fa-solid fa-circle-exclamation me-1"></i> {{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <!-- Submit Button -->
                <button type="submit" class="btn btn-neon w-100 py-3 mt-3 fw-bold">
                    <i class="fa-solid fa-rocket me-2"></i> Complete Registration
                </button>
            </form>

            <!-- Bottom Separator & Sign In Link -->
            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                <span class="text-sub">Already registered?</span> 
                <a href="{% url 'login' %}" class="neon-text-cyan fw-bold text-decoration-none ms-1 hover-glow">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
